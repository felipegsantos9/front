<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo's Motors | Agendamento</title>
    <link rel="stylesheet" href="agendamento.css">
    <link rel="icon" href="Assets/Ricardo's Motors.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Lacquer&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
        integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
        crossorigin="anonymous" referrerpolicy="no-referrer">

</head>

<body>

    <header class="header">
        <section class="header-content">
            <h1>Ricardo's Motors | Fazer Agendamento</h1>
            <img src="Assets/Ricardo's Motors.png" alt="Logo da Ricardo's Motors" class="logo">
        </section>


        <section class="header-user">
                <p id="Data-usuario">Usuário</p>
                <i class="fa-solid fa-circle-user" style="color: #fff;"></i>

        </section>
        <section class="menu-lateral">
            <nav>
                <ul>
                    <section class="utilitarios">
                        <ul>
                            <li><a href="./paginainicial.html"><i class="fa-solid fa-house"></i>Página Inicial</a></li>
                            <li><a href="./cliente.html"><i class="fa-solid fa-user"></i>Cadastro Clientes</a></li>
                            <li><a href="./veiculo.html"><i class="fa-solid fa-car"></i>Cadastro Veículos</a></li>
                            <li><a href="./agendamento.html"><i class="fa-solid fa-calendar"></i>Agendamentos</a></li>
                        </ul>
                    </section>
                    <section class="listagens">
                        <ul>
                            <li><a href="./listagem-clientes.html"><i class="fa-solid fa-users"></i>Listar clientes</a>
                            </li>
                            <li><a href="./listagem-agendamentos.html"><i class="fa-solid fa-calendar-days"></i>Listar
                                    agendamentos</a></li>
                        </ul>
                    </section>
                    <section class="others">
                        <ul>
                            <li><a href="./index.html"><i class="fa-solid fa-arrow-right-from-bracket"
                                        style="color: #fff;"></i>Sair</a></li>
                        </ul>
                    </section>
                </ul>
            </nav>
        </section>
    </header>

    <main class="main">
        <div class="conteudo-principal">
            <h2>Fazer Agendamento</h2>
            <br>

            <form id="cadastro-form">
                <div class="card">
                    <label for="Data">Data:</label>
                    <input type="datetime" id="Data" name="Data" required>
                </div>

                <div class="card">
                    <label for="Cliente-Id">Cliente Id:</label>
                    <input type="text" id="Cliente-Id" name="Cliente-Id" required>
                </div>

                <div class="card">
                    <label for="Carro-Id">Carro Id:</label>
                    <input type="text" id="Carro-Id" name="Carro-Id" required>
                </div>

                <div class="card">
                    <label for="Usuario-Id">Usuario Id</label>
                    <input type="text" id="Usuario-Id" name="Usuario-Id" required>
                </div>

                <button class="cadastro-form-button" type="submit">Cadastrar</button>

        </div>
    </main>

</body>

</html>
