<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ricardo's Motors | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="Assets/Ricardo's Motors.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bruno+Ace&family=Lacquer&display=swap" rel="stylesheet">
</head>

<body>
    <main>
        <div class="login-section">
            <form type="submit" onsubmit="event.preventDefault(); window.location.href='./paginainicial.html'" method="POST" class="login-form">
                <h1>Ricardo's Motors</h1>
                <img src="Assets/Ricardo's Motors.png" alt="Logo da Ricardo's Motors" class="logo">
                <h2>Login</h2>
                <label for="username">Usuário:</label>
                <input type="text" id="username" name="username" required placeholder="Digite seu usuário">

                <label for="password">Senha:</label>
                <input type="password" id="password" name="password" required placeholder="Digite sua senha">

                <button type="submit" onclick="window.location.href='./paginainicial.html'">Entrar</button>
            </form>
        </div>
    </main>
</body>

</html>
